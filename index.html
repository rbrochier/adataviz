<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Budget Participatif : Les Projets Lauréats</title>
</head>

<body>
    <header>
        <h1>Budget Participatif de la Ville de Paris
        <br>Les Projets Lauréats</h1>
    </header>
    <main>
    <section class="recherche">
        <form id="form-recherche">
            <label for="site-search">Rechercher un projet :</label>
            <input type="search" id="site-search" />
            <button>Rechercher</button>
        </form>
    </section>

    <section class="menu-themes" >
    <h2>Thématiques</h2>
    <ul id="liste-themes"></ul>
    </section>

    <section class="carte-projet cache" id="page-thematique">
        <h2 id="thematique-choisie">Prévention et Sécurité</h2>
        <p id="compteur-projets">Projet 1/50</p>
        <div id="detail-projet">
            <article>
                <h3 class="nom-projet">Piétonnisation de la rue Saint-Jean</h3>
                <p class="arrondissement">17ème Arrondissement</p>
                <p class="avancement-projet">FIN</p>
                <p class="dates">2015</p>
                <p class="budget">320 000€</p>
                <a href="https://decider.paris.fr/bp/jsp/site/Portal.jsp?document_id=1484&amp;portlet_id=158"
                    class="url-projet">Lien vers le Projet</a>
            </article>
        </div>
        <section id="bouton-navigation">
        <button type="button" id="bouton-retour">Retour</button>
        <button type ="button" id="bouton-suivant">Suivant</button>
        <button type="button" id="retour-menu">Retour Menu</button>
        </section>
    </section>


    </main>
    <script type="module" src="main.js"></script>
    <script type="module" src="utils.js"></script>

</body>

</html>
